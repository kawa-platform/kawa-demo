# Sets up mission control (virtual topics, SASL clients, RBAC; scripts/seed.sh) and the governance
# rules (scripts/governance.sh) in the gateway, with a headless admin login. k8s/up.sh applies it,
# waits for it to complete, then starts k8s/demo.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: kawa-seed
  labels: {app.kubernetes.io/name: kawa-seed, app.kubernetes.io/part-of: kawa-demo}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: seed
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "apk add --no-cache -q bash curl jq openssl >/dev/null && bash /demo/scripts/seed.sh && exec bash /demo/scripts/governance.sh"]
          env:
            - {name: ADMIN_URL, value: "http://kawa-gateway:8080"}
            - {name: STUDIO_URL, value: "http://localhost:5173"}
            - name: KAWA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: kawa-gateway, key: admin-password}}
          volumeMounts:
            - {name: scripts, mountPath: /demo/scripts}
            - {name: clients, mountPath: /demo/clients}
            - {name: schemas, mountPath: /demo/schemas}
      volumes:
        - name: scripts
          configMap: {name: kawa-demo-scripts, defaultMode: 0755}
        - name: clients
          configMap: {name: kawa-demo-clients}
        - name: schemas
          configMap: {name: kawa-demo-schemas}
