# Mission control on the gateway, as kawa operator resources: the operator applies them through the
# gateway's admin API and keeps the gateway in sync with them. This is what scripts/gateway-init.sh sets up
# in the compose demo. k8s/up.sh applies it; to change mission control, edit it and kubectl apply it again.
#
#   Virtual topics  telemetry.alerts   -> telemetry.raw    value.severity in ["warning", "critical"]
#                   navigation.artemis -> navigation.raw   Avro decoded via the schema registry,
#                                                          value.craft == "artemis-3"
#   SASL clients    spacecraft  the flight computer: streams telemetry and state vectors, and
#                               receives the uplinked commands
#                   director    the flight director: sees everything, uplinks commands, opens topics
#                   systems     the systems engineer: telemetry alerts only
#                   navigator   the navigation officer: Artemis state vectors only
#   Passwords are <client>-secret; each client's consumer groups are <client>.<purpose>.
#
# Each physical topic backs exactly one virtual topic, and the physical topics stay visible
# (exposePhysicalTopic) so the spacecraft can produce to them.

# 🛰️ Virtual topics
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: VirtualTopic
metadata:
  name: telemetry.alerts
spec:
  physicalTopic: telemetry.raw
  exposePhysicalTopic: true
  valueFormat: {type: json}
  filter:
    type: cel
    expression: 'value.severity in ["warning", "critical"]'
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: VirtualTopic
metadata:
  name: navigation.artemis
spec:
  physicalTopic: navigation.raw
  exposePhysicalTopic: true
  valueFormat: {type: avro}
  filter:
    type: cel
    expression: 'value.craft == "artemis-3"'
---
# 🔑 SASL clients
apiVersion: v1
kind: Secret
metadata:
  name: kawa-demo-client-passwords
stringData:
  spacecraft: spacecraft-secret
  director: director-secret
  systems: systems-secret
  navigator: navigator-secret
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Client
metadata:
  name: spacecraft
spec:
  mechanism: PLAIN
  passwordSecretRef: {name: kawa-demo-client-passwords, key: spacecraft}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Client
metadata:
  name: director
spec:
  mechanism: PLAIN
  passwordSecretRef: {name: kawa-demo-client-passwords, key: director}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Client
metadata:
  name: systems
spec:
  mechanism: PLAIN
  passwordSecretRef: {name: kawa-demo-client-passwords, key: systems}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Client
metadata:
  name: navigator
spec:
  mechanism: PLAIN
  passwordSecretRef: {name: kawa-demo-client-passwords, key: navigator}
---
# 🛡️ RBAC roles. DESCRIBE on the virtual names too: the gateway authorizes Metadata for an exposed
# physical topic under its virtual name, so without it telemetry.raw never shows up for the spacecraft.
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Role
metadata:
  name: flight-computer
spec:
  acls:
    - {resource: {type: TOPIC, pattern: telemetry.raw}, operation: WRITE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: telemetry.raw}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: telemetry.alerts}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation.raw}, operation: WRITE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation.raw}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation.artemis}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: commands.uplink}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: commands.uplink}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: GROUP, pattern: spacecraft., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: GROUP, pattern: spacecraft., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Role
metadata:
  name: flight-director
spec:
  acls:
    - {resource: {type: TOPIC, pattern: telemetry., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: telemetry., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: commands., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: commands., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: commands., patternType: PREFIXED}, operation: WRITE, permission: ALLOW}
    - {resource: {type: CLUSTER}, operation: CREATE, permission: ALLOW}
    - {resource: {type: GROUP, pattern: director., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: GROUP, pattern: director., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Role
metadata:
  name: alerts-console
spec:
  acls:
    - {resource: {type: TOPIC, pattern: telemetry.alerts}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: telemetry.alerts}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: GROUP, pattern: systems., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: GROUP, pattern: systems., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Role
metadata:
  name: navigation-console
spec:
  acls:
    - {resource: {type: TOPIC, pattern: navigation.artemis}, operation: READ, permission: ALLOW}
    - {resource: {type: TOPIC, pattern: navigation.artemis}, operation: DESCRIBE, permission: ALLOW}
    - {resource: {type: GROUP, pattern: navigator., patternType: PREFIXED}, operation: READ, permission: ALLOW}
    - {resource: {type: GROUP, pattern: navigator., patternType: PREFIXED}, operation: DESCRIBE, permission: ALLOW}
---
# 👩‍🚀 RBAC groups
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Group
metadata:
  name: spacecraft
spec:
  clients: [spacecraft]
  roles: [flight-computer]
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Group
metadata:
  name: flight-directors
spec:
  clients: [director]
  roles: [flight-director]
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Group
metadata:
  name: systems-engineers
spec:
  clients: [systems]
  roles: [alerts-console]
---
apiVersion: kawa.kawa-platform.github.io/v1alpha1
kind: Group
metadata:
  name: navigation-officers
spec:
  clients: [navigator]
  roles: [navigation-console]
