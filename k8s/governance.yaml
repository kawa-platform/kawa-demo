# Loads the governance rules (scripts/governance.sh) into the gateway, with a headless admin login.
# Governance has no operator resource, so it stays a job; everything else is k8s/mission-control.yaml.
# k8s/up.sh applies it and waits for it to complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: kawa-governance
  labels: {app.kubernetes.io/name: kawa-governance, app.kubernetes.io/part-of: kawa-demo}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: governance
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "apk add --no-cache -q bash curl jq openssl >/dev/null && exec bash /demo/scripts/governance.sh"]
          env:
            - {name: ADMIN_URL, value: "http://kawa-gateway:8080"}
            - {name: STUDIO_URL, value: "http://localhost:5173"}
            - name: KAWA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: kawa-gateway, key: admin-password}}
          volumeMounts:
            - {name: scripts, mountPath: /demo/scripts}
      volumes:
        - name: scripts
          configMap: {name: kawa-demo-scripts, defaultMode: 0755}
