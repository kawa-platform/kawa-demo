# Confluent Schema Registry for the Avro part of the demo. It stores schemas in its own _schemas
# topic on the broker directly (not through the gateway).
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  labels: {app.kubernetes.io/name: schema-registry, app.kubernetes.io/part-of: kawa-demo}
spec:
  selector: {app.kubernetes.io/name: schema-registry}
  ports:
    - {name: http, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  labels: {app.kubernetes.io/name: schema-registry, app.kubernetes.io/part-of: kawa-demo}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: schema-registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: schema-registry, app.kubernetes.io/part-of: kawa-demo}
    spec:
      # Service links would inject SCHEMA_REGISTRY_PORT=tcp://..., which the image reads as config.
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: ${SCHEMA_REGISTRY_IMAGE}:${SCHEMA_REGISTRY_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8081}
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081"}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "PLAINTEXT://kafka:9092"}
          readinessProbe:
            httpGet: {path: /subjects, port: 8081}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
