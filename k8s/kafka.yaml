# A single-node Kafka (KRaft, combined broker + controller) for the demo, plus a Job that creates
# the physical topics. Not for production: no persistence, replication factor 1.
# ${...} placeholders are filled from versions.env by k8s/up.sh (envsubst).
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kawa-demo}
spec:
  selector: {app.kubernetes.io/name: kafka}
  ports:
    - {name: kafka, port: 9092, targetPort: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kawa-demo}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: kawa-demo}
    spec:
      enableServiceLinks: false
      containers:
        - name: kafka
          image: ${KAFKA_IMAGE}:${KAFKA_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: kafka, containerPort: 9092}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://localhost:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  labels: {app.kubernetes.io/name: kafka-topics-init, app.kubernetes.io/part-of: kawa-demo}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: kafka-topics-init
          image: ${KAFKA_TOOLS_IMAGE}:${KAFKA_VERSION}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1; do
                echo "waiting for kafka..."; sleep 2;
              done
              for t in telemetry.raw navigation.raw commands.uplink; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
                  --create --if-not-exists --topic "$t" --partitions 3 --replication-factor 1
              done
              echo "physical topics ready"
